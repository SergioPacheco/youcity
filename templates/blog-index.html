<!doctype html>
<html lang="en">
  <head>
    <!-- YouCity Consent Mode v2 default - Must run synchronously before GTM.
         Same as index.html / privacy.html. Keep storage key/version in sync with
         src/integrations/consent.mjs. -->
    <script>
      (function () {
        try {
          window.dataLayer = window.dataLayer || [];
          window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
          var stored = null;
          try {
            var raw = window.localStorage.getItem("youcity_consent_v1");
            if (raw) {
              var parsed = JSON.parse(raw);
              if (
                parsed && parsed.version === 1 && parsed.consent &&
                typeof parsed.consent.ad_storage === "string" &&
                typeof parsed.consent.analytics_storage === "string" &&
                typeof parsed.consent.ad_user_data === "string" &&
                typeof parsed.consent.ad_personalization === "string"
              ) {
                stored = parsed.consent;
              }
            }
          } catch (e) {}
          var def = stored || {
            ad_storage: "denied",
            analytics_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied"
          };
          window.gtag("consent", "default", {
            ad_storage: def.ad_storage,
            analytics_storage: def.analytics_storage,
            ad_user_data: def.ad_user_data,
            ad_personalization: def.ad_personalization
          });
          window.__YOUCITY_CONSENT_DEFAULT__ = def;
        } catch (e) {}
      })();
    </script>
    <!-- Google Tag Manager. Same lazy boot as index.html: loaded after `load`
         via requestIdleCallback so gtm.js parse/eval doesn't compete with LCP.
         dataLayer/gtag stub above queues events until boot. -->
    <script>
      (function (w, d, l, i) {
        w[l] = w[l] || [];
        var boot = function () {
          w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = d.getElementsByTagName('script')[0],
            j = d.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + '&l=' + l;
          f.parentNode.insertBefore(j, f);
        };
        if (d.readyState === 'complete') boot();
        else d.addEventListener('load', function () {
          if ('requestIdleCallback' in w) w.requestIdleCallback(boot, { timeout: 2000 });
          else setTimeout(boot, 0);
        }, { once: true });
      })(window, document, 'dataLayer', 'GTM-M64MQRNM');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />

  </head>
