name: Facebook Reels Daily

on:
  schedule:
    - cron: '0 15 * * *' # 12:00 BRT
    - cron: '0 21 * * *' # 18:00 BRT
  workflow_dispatch:
    inputs:
      city:
        description: 'Slug da cidade da biblioteca (opcional)'
        required: false
      generate_only:
        description: 'Revisar um vídeo da biblioteca sem publicar'
        type: boolean
        default: false

concurrency:
  group: youcity-shorts-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FB_SYSTEM_USER_TOKEN: ${{ secrets.FB_SYSTEM_USER_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate Facebook configuration
        if: ${{ inputs.generate_only != true }}
        run: |
          if [ -z "$FB_SYSTEM_USER_TOKEN" ] || [ -z "$FACEBOOK_PAGE_ID" ]; then
            echo "Configure os secrets FB_SYSTEM_USER_TOKEN e FACEBOOK_PAGE_ID."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install publishing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-social.txt

      - name: Test prerecorded selection and publishing
        run: |
          python scripts/test-shorts-regressions.py
          python scripts/test-reels-library.py

      - name: Validate all 100 prerecorded drones
        run: python -m tools.social.reels_library --expected-count 100

      - name: Publish prerecorded Facebook Reel
        env:
          CITY: ${{ inputs.city }}
          GENERATE_ONLY: ${{ inputs.generate_only }}
        run: |
          args=(--source prerecorded --platforms facebook)
          if [ -n "$CITY" ]; then
            args+=(--city "$CITY")
          fi
          if [ "$GENERATE_ONLY" = "true" ]; then
            args+=(--generate-only)
          fi
          python tools/social/shorts_daily.py "${args[@]}"

      - name: Save selected video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reels-video
          path: out/shorts/**/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist history
        if: ${{ always() && inputs.generate_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f social/shorts_published.json ]; then
            git add social/shorts_published.json
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(shorts): record daily publications"
            git push
          else
            echo "No changes to persist"
          fi
